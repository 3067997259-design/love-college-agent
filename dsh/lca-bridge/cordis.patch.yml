# LCA layer over dsh-base: DSH runs her chat and work turns inside Love, College & Agent.
# The LCA main process owns the window, the book UI, credentials and every approval answer.
# New sessions keep dsh-base defaults (workspace-write + ask).

# `lca-trusted` is applied per session only after the user grants a project in the book ("这个项目以后
# 都允许"; maintainer decision 2026-10-19): same-user trust with no OS sandbox, approvals still asked.
# lca-bridge keeps asking before risky commands and refuses LCA's private data in every mode. On Windows
# the ACL sandbox cannot grant on drives that withhold WRITE_DAC, so trust is per project.
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      lca-trusted:
        sandbox: danger-full-access
        approval: ask
        name: 项目内信任
        description: 在你选定的项目里像你一样读写文件、运行命令；危险操作先问你，LCA 私有数据不碰。

# She is the persona; LCA registers it per agent in `deployment:persona-prefix`.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ''

# The model route comes from LCA's own connection settings at launch: DeepSeek's official API through
# dsh-llm-deepseek, or LCA's OpenAI-compatible endpoint as the `lca-chat` pi-ai route. Keys stay in
# the launch environment (credentials store disabled below).
- id: llm-pi-ai
  config:
    providers: !!js "process.env.LCA_CHAT_BASE_URL ? { 'lca-chat': { displayName: 'LCA', apiKeyEnv: 'LCA_CHAT_API_KEY', api: 'openai-completions', baseURL: process.env.LCA_CHAT_BASE_URL, models: [{ id: process.env.LCA_CHAT_MODEL }] } } : {}"

- id: agent-default-model
  config:
    provider: !!js "process.env.LCA_CHAT_BASE_URL ? 'lca-chat' : 'deepseek-official'"
    model: !!js "process.env.LCA_CHAT_BASE_URL ? process.env.LCA_CHAT_MODEL : (process.env.LCA_DSH_MODEL ?? 'deepseek-flash')"

# Launch-time credentials, no account login, no telemetry, no extra title calls, no HMR.
- id: credentials
  disabled: true

- id: authorization
  disabled: true

- id: deepseek-account
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: otel
  disabled: true

- id: session-telemetry-otel
  disabled: true

- id: session-title-llm
  disabled: true

- id: hmr
  disabled: true

- insert:
    - id: lca-bridge
      name: '@lca/dsh-bridge'
